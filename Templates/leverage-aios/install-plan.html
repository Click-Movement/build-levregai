    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin

    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);

              const { done, value } = await reader.read();

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    // autoConfig:false stops Meta's history/SPA auto-PageView after design-canvas boot.
    // Stub + callMethod guards drop any second PageView on this page load.
    if (!window.__levregMetaInstalled) {
      window.__levregMetaInstalled = true;
      window.__levregPVSent = false;
      !function(f,b,e,v,n,t,s){
        if(f.fbq)return;
        n=f.fbq=function(){
          try {

        };

        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];

  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 */\n  --line-strong: #0D1117; /* emphatic rules, structural hairlines */\n\n  /* Accent — brand cyan */\n  --accent: #0EA5E9;      /* primary accent, CTAs, <em> highlights */\n  --accent-deep: #0284C7; /* AA-safe link blue / hover */\n  --accent-2: #14B870;    /* supporting green accent */\n  --accent-ink: #FFFFFF;  /* text on accent fills */\n\n  /* Status */\n  --ok: #16A34A;          /* success / live-status dot */\n}\n\n/* Default anchor styling so user-added links don't render browser-blue. */\na { color: var(--accent-deep); }\na:hover { color: var(--fg); }\n<\/style>\n<style>\n  html{scroll-behavior:smooth}\n  body{margin:0;background:#F6F2EB;color:#111110;font-family:'Inter',system-ui,sans-serif;font-feature-settings:\"ss01\",\"cv11\";-webkit-font-smoothing:antialiased}\n  a{color:#0EA5E9;text-decoration:none}\n  a:hover{color:#0284C7}\n  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(14,165,233,.45)}50%{box-shadow:0 0 0 7px rgba(14,165,233,0)}}\n<\/style>\n<\/helmet>\n\n<header style=\"background:#F6F2EB;border-bottom:1px solid #E5E7EB\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:center\">\n    <img src=\"64b92097-00e6-4c17-9bb6-22c1f97a347a\" alt=\"LevReg.AI\" style=\"height:30px;display:block\">\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<section style=\"max-width:960px;margin:0 auto;padding:96px 28px 72px;text-align:center\" data-screen-label=\"01 Hero\">\n  <div style=\"display:inline-flex;align-items:center;gap:10px;border:1px solid #E5E7EB;background:#fff;border-radius:999px;padding:8px 18px;font-size:13.5px;font-weight:500;color:#55524C;margin-bottom:34px\">\n    We install AiOS for a limited number of companies each month\n  <\/div>\n  <h1 style=\"font-size:clamp(35px,5.2vw,62px);line-height:1.04;letter-spacing:-0.03em;font-weight:800;margin:0 0 26px\">This is for owners who are done being the answer to <em style=\"font-style:normal;color:#0EA5E9\">every question<\/em>.<\/h1>\n  <p style=\"font-size:clamp(17px,1.6vw,21px);line-height:1.55;color:#3B3934;max-width:700px;margin:0 auto 12px\">This is where you find out if your company is one of them.<\/p>\n  <p style=\"font-size:clamp(17px,1.6vw,21px);line-height:1.55;color:#3B3934;max-width:700px;margin:0 auto 36px\"><strong>It takes two minutes.<\/strong> You'll see which engine goes in first, what it would ship in week one, and what an AiOS-Certified Operator would take off your plate.<\/p>\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px\">\n    <a href=\"{{ ctaUrl }}\" style=\"display:inline-block;background:#0EA5E9;color:#fff;padding:18px 40px;border-radius:8px;font-weight:700;font-size:17px\" style-hover=\"background:#0284C7;color:#fff\">Get Your Install Plan<\/a>\n    <p style=\"font-size:14px;color:#78746B;margin:0\">Free, whether we work together or not.<\/p>\n    <p style=\"font-size:14px;color:#78746B;margin:0\">No pitch. No pressure. Just a straight read on whether we can help.<\/p>\n  <\/div>\n<\/section>\n\n<section style=\"background:#fff;border-top:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;padding:90px 28px\" data-screen-label=\"02 Sound familiar\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <h2 style=\"text-align:center;font-size:clamp(32px,4vw,48px);font-weight:800;letter-spacing:-0.025em;line-height:1.05;margin:0 0 14px\">Sound familiar?<\/h2>\n    <p style=\"text-align:center;font-size:18px;color:#3B3934;margin:0 0 52px\">You already tried to hand this off.<\/p>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:44px\">\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:30px\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:10px\">The VA<\/div>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#3B3934;margin:0\">Needed a walkthrough for everything. You spent more time managing them than doing it yourself.<\/p>\n      <\/div>\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:30px\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:10px\">The agency retainer<\/div>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#3B3934;margin:0\">Sent a monthly PDF you couldn't connect to revenue.<\/p>\n      <\/div>\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:30px\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:10px\">The \"top 1%\" placement<\/div>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#3B3934;margin:0\">Five times the cost. Better. Still waiting on your context, your approvals, your answers.<\/p>\n      <\/div>\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:30px\">\n        <div style=\"font-size:15px;font-weight:700;margin-bottom:10px\">The AI tools<\/div>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#3B3934;margin:0\">Supposed to change everything. The seats are still sitting there, unused.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"text-align:center;max-width:620px;margin:0 auto\">\n      <p style=\"font-size:20px;line-height:1.55;font-weight:600;margin:0\">Each one arrived with more questions than the last. <span style=\"color:#0EA5E9\">So every road led back through you.<\/span><\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section style=\"background:#111110;color:#F6F2EB;padding:100px 28px\" data-screen-label=\"03 The architecture\">\n  <div style=\"max-width:880px;margin:0 auto;text-align:center\">\n    <h2 style=\"font-size:clamp(32px,4.4vw,52px);font-weight:800;letter-spacing:-0.025em;line-height:1.06;margin:0 0 28px\">Here's what actually keeps it landing on your desk.<br><em style=\"font-style:normal;color:#0EA5E9\">The answers only live at the top.<\/em><\/h2>\n    <p style=\"font-size:18px;line-height:1.65;color:#B9B4AA;max-width:640px;margin:0 auto 18px;font-style:italic\">How you decide. What you'd say. Where the line is. What matters more than what.<\/p>\n    <p style=\"font-size:18px;line-height:1.65;color:#B9B4AA;max-width:640px;margin:0 auto 36px\">None of it exists anywhere your team can go get it. So they come get it from you. <strong style=\"color:#F6F2EB\">That's not discipline on their end. It's architecture on yours.<\/strong><\/p>\n    <div style=\"background:rgba(246,242,235,.05);border:1px solid rgba(246,242,235,.14);border-radius:20px;padding:32px 36px;max-width:660px;margin:0 auto 56px;text-align:left\">\n      <p style=\"font-size:16.5px;line-height:1.6;margin:0 0 12px;color:#F6F2EB\">Change where the answers live, and the questions stop climbing. <em style=\"font-style:normal;color:#0EA5E9;font-weight:600\">That's what AiOS installs.<\/em><\/p>\n      <p style=\"font-size:16.5px;line-height:1.6;margin:0;color:#B9B4AA\">One OS. Three engines. One operator. One report.<\/p>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;text-align:left\">\n      <div style=\"background:rgba(246,242,235,.04);border:1px solid rgba(246,242,235,.14);border-radius:20px;padding:30px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#0EA5E9;margin-bottom:14px\">The engines<\/div>\n        <p style=\"font-size:15.5px;line-height:1.65;color:#B9B4AA;margin:0\">We install the engines that run your marketing, sales, and support — built from your business instead of a template.<\/p>\n      <\/div>\n      <div style=\"background:rgba(246,242,235,.04);border:1px solid rgba(246,242,235,.14);border-radius:20px;padding:30px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#0EA5E9;margin-bottom:14px\">The operator<\/div>\n        <p style=\"font-size:15.5px;line-height:1.65;color:#B9B4AA;margin:0\">Then we place an AiOS-Certified Operator to run them. It doesn't just do the work. It holds the decision.<\/p>\n      <\/div>\n    <\/div>\n    <p style=\"font-size:18px;line-height:1.65;color:#B9B4AA;max-width:640px;margin:40px auto 0\">Every week, you read what shipped on a meter. Per engine. In plain numbers. <strong style=\"color:#F6F2EB\">The work keeps moving whether or not you touch it, and the questions stop climbing to your desk.<\/strong><\/p>\n  <\/div>\n<\/section>\n\n<section id=\"fit\" style=\"max-width:1100px;margin:0 auto;padding:100px 28px\" data-screen-label=\"04 Is this a fit\">\n  <div style=\"text-align:center;margin-bottom:52px\">\n    <h2 style=\"font-size:clamp(32px,4vw,48px);font-weight:800;letter-spacing:-0.025em;line-height:1.05;margin:0 0 16px\">Is this a fit?<\/h2>\n    <p style=\"font-size:17.5px;color:#3B3934;max-width:600px;margin:0 auto;line-height:1.6\">Be honest with yourself for sixty seconds. This works when the shoe fits and wastes everyone's time when it doesn't.<\/p>\n  <\/div>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:40px\">\n    <div style=\"background:#fff;border:1px solid #0EA5E9;border-radius:24px;padding:36px;box-shadow:0 0 0 4px rgba(14,165,233,.08)\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#0EA5E9;margin-bottom:22px\">You're likely a fit if<\/div>\n      <div style=\"display:grid;gap:16px\">\n        <sc-for list=\"{{ fitRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start\">\n            <span style=\"width:26px;height:26px;flex-shrink:0;border-radius:99px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.4);display:flex;align-items:center;justify-content:center;color:#0EA5E9;font-size:13px;margin-top:1px\" aria-hidden=\"true\">✓<\/span>\n            <p style=\"font-size:15.5px;line-height:1.6;color:#3B3934;margin:0\">{{ row }}<\/p>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n    <div style=\"background:#fff;border:1px solid #E5E7EB;border-radius:24px;padding:36px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#78746B;margin-bottom:22px\">Probably not yet if<\/div>\n      <div style=\"display:grid;gap:16px\">\n        <sc-for list=\"{{ notFitRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start\">\n            <span style=\"width:26px;height:26px;flex-shrink:0;border-radius:99px;background:#F6F2EB;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;color:#78746B;font-size:13px;margin-top:1px\" aria-hidden=\"true\">✕<\/span>\n            <p style=\"font-size:15.5px;line-height:1.6;color:#78746B;margin:0\">{{ row }}<\/p>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div style=\"text-align:center;max-width:640px;margin:0 auto\">\n    <p style=\"font-size:17.5px;line-height:1.6;color:#3B3934;margin:0\">If that first list is you, the install plan is the next step. If it's the second list, you'll get pointed somewhere more useful. <strong>No hard feelings.<\/strong><\/p>\n  <\/div>\n<\/section>\n\n<section style=\"background:#fff;border-top:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;padding:90px 28px\" data-screen-label=\"05 How it goes in\">\n  <div style=\"max-width:1100px;margin:0 auto\">\n    <div style=\"text-align:center;margin-bottom:52px\">\n      <h2 style=\"font-size:clamp(32px,4vw,48px);font-weight:800;letter-spacing:-0.025em;line-height:1.05;margin:0 0 16px\">How it goes in.<\/h2>\n      <p style=\"font-size:17.5px;color:#3B3934;max-width:560px;margin:0 auto;line-height:1.6\">No black boxes. No hard sell. Three steps, and you get something real at each one.<\/p>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:1fr;gap:16px;max-width:720px;margin:0 auto\">\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:32px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#0EA5E9;margin-bottom:14px\">STEP 1<\/div>\n        <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px\">Fill out the application.<\/h3>\n        <p style=\"font-size:15px;line-height:1.6;color:#3B3934;margin:0\">A few questions about your business, your team, and where you're stuck right now. Two minutes. It's also the first pass at your install plan... your answers tell us which of the three loops is eating the most of your week.<\/p>\n      <\/div>\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:32px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#0EA5E9;margin-bottom:14px\">STEP 2<\/div>\n        <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px\">Book your Install Plan.<\/h3>\n        <p style=\"font-size:15px;line-height:1.6;color:#3B3934;margin:0\">Pick a time and lock it in. Thirty minutes, live. This is your Leverage Audit.<\/p>\n      <\/div>\n      <div style=\"background:#F6F2EB;border:1px solid #E5E7EB;border-radius:20px;padding:32px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#0EA5E9;margin-bottom:14px\">STEP 3<\/div>\n        <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px\">You get a clear next step.<\/h3>\n        <p style=\"font-size:15px;line-height:1.6;color:#3B3934;margin:0\">We walk through your custom Install Plan together, so you leave knowing the biggest leverage points in your business. Which engine goes in first, and what it would ship in week one. Whether or not we work together, that plan is yours.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"book\" style=\"background:#111110;color:#F6F2EB;padding:110px 28px\" data-screen-label=\"06 Final CTA\">\n  <div style=\"max-width:760px;margin:0 auto;text-align:center\">\n    <h2 style=\"font-size:clamp(34px,4.6vw,56px);font-weight:800;letter-spacing:-0.03em;line-height:1.04;margin:0 0 22px\">Get your <em style=\"font-style:normal;color:#0EA5E9\">install plan<\/em>.<\/h2>\n    <p style=\"font-size:18px;line-height:1.65;color:#B9B4AA;margin:0 0 12px\"><strong style=\"color:#F6F2EB\">It takes two minutes. Free.<\/strong><\/p>\n    <p style=\"font-size:18px;line-height:1.65;color:#B9B4AA;margin:0 0 12px\">You'll tell us which of the three loops is eating the most of your week and what's already been tried. We'll map where your business leaks hours, context, and money... and which processes still live in someone's head. Then we walk you through it live on a 30-minute Leverage Audit.<\/p>\n    <p style=\"font-size:18px;line-height:1.65;color:#F6F2EB;margin:0 0 36px;font-weight:600\">You leave with the plan either way.<\/p>\n    <a href=\"{{ ctaUrl }}\" style=\"display:inline-block;background:#0EA5E9;color:#fff;padding:19px 44px;border-radius:8px;font-weight:700;font-size:18px\" style-hover=\"background:#0284C7;color:#fff\">Get Your Install Plan<\/a>\n    <div style=\"margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#78746B\">\n      <span style=\"display:inline-block;width:7px;height:7px;border-radius:99px;background:#0EA5E9;margin-right:8px;animation:pulseDot 2.4s infinite\" aria-hidden=\"true\"><\/span>\n      We certify and place a limited number of operators each month\n    <\/div>\n    <div style=\"margin-top:60px;padding-top:40px;border-top:1px solid rgba(246,242,235,.14)\">\n      <p style=\"font-size:20px;font-weight:600;line-height:1.55;margin:0\">Count the questions that reached you today.<br>Then decide which job you want to be doing <em style=\"font-style:normal;color:#0EA5E9\">next Monday<\/em>.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<footer style=\"background:#111110;color:#78746B;border-top:1px solid rgba(246,242,235,.12);padding:36px 28px\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n    <img src=\"4bb768ec-b755-4522-94ee-46ea9c4f25dd\" alt=\"LevReg.AI\" style=\"height:24px\">\n    <nav style=\"display:flex;gap:26px;font-size:13.5px\" aria-label=\"Footer\">\n      <a href=\"AiOS%20Landing%20v2.dc.html#aios\" style=\"color:#B9B4AA\" style-hover=\"color:#F6F2EB\">Our Process<\/a>\n      <a href=\"AiOS%20Our%20Talent.dc.html\" style=\"color:#B9B4AA\" style-hover=\"color:#F6F2EB\">Our Talent<\/a>\n      <a href=\"AiOS%20Our%20Story.dc.html\" style=\"color:#B9B4AA\" style-hover=\"color:#F6F2EB\">About Us<\/a>\n    <\/nav>\n    <div style=\"font-size:13px\">© 2026 LevReg.AI<\/div>\n  <\/div>\n<\/footer>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;ctaUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/apply&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CTA&quot;,&quot;description&quot;:&quot;Application / booking form URL for all Get Your Install Plan buttons&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const fitRows = [\n      \"You're the founder or owner, doing $1M to $10M, and most questions in the building still route to you.\",\n      \"You've got 5 to 40 people, and the business still needs you in the daily work to keep moving.\",\n      \"You've tried to hand this off before — a VA, an agency, a senior hire, AI tools — and it came back to you.\",\n      \"You want the marketing, sales, or support work to actually come off your desk. Not get reassigned to the next person who has to learn it.\",\n      \"You want to stay the CEO. Not become the in-house AI expert.\",\n    ];\n    const notFitRows = [\n      \"You're pre-revenue or under about $1M. The engines need a real business to install on, and there isn't enough there yet.\",\n      \"You want to be taught AI, not have it installed and run for you. Start with the $97 workshop instead — it's built for exactly that.\",\n      \"You're shopping for the cheapest task-taker by the hour. That's a different purchase, and we're not the low bid.\",\n      \"You're not willing to let an operator run the machine once it's built. This only works if you let it.\",\n    ];\n    return { fitRows, notFitRows, ctaUrl: this.props.ctaUrl ?? '#book' };\n  }\n}\n\n<\/script>\n\n\n<\/body><\/html>"</script>
